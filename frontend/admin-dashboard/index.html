<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Dashboard | Figbloom Digital Group</title>
    <link rel="stylesheet" href="/assets/css/style.css" />
    <style>
      :root {
        --fb-green: #1a3a1a;
        --fb-orange: #ff9400;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fafafa;
        color: #1f2937;
      }

      .db-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 1rem 1.75rem;
        background: #ffffff;
        border-bottom: 1px solid #eaeaea;
      }

      .db-header-left {
        display: flex;
        align-items: center;
        gap: 0.75rem;
      }

      .db-header-left img {
        width: 42px;
      }

      .db-header-left span {
        font-weight: 700;
        color: var(--fb-green);
        font-size: 1.05rem;
      }

      .db-logout {
        border: 1px solid #d1d5db;
        background: #ffffff;
        padding: 0.5rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
        color: #374151;
      }

      .db-logout:hover {
        border-color: var(--fb-orange);
        color: var(--fb-orange);
      }

      .db-tabs {
        display: flex;
        gap: 0.5rem;
        padding: 1rem 1.75rem 0;
        background: #ffffff;
        border-bottom: 1px solid #eaeaea;
      }

      .db-tab {
        padding: 0.6rem 1.1rem;
        border-radius: 8px 8px 0 0;
        cursor: pointer;
        font-size: 0.9rem;
        font-weight: 500;
        color: #6b7280;
        border: 1px solid transparent;
      }

      .db-tab.active {
        color: var(--fb-green);
        border: 1px solid #eaeaea;
        border-bottom: 1px solid #ffffff;
        background: #ffffff;
        margin-bottom: -1px;
      }

      .db-content {
        padding: 1.75rem;
        max-width: 1200px;
        margin: 0 auto;
      }

      .db-panel {
        display: none;
      }

      .db-panel.active {
        display: block;
      }

      .db-panel-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 1.25rem;
      }

      .db-panel-header h2 {
        margin: 0;
        color: var(--fb-green);
        font-size: 1.25rem;
      }

      .db-btn-primary {
        background: var(--fb-orange);
        color: #ffffff;
        border: none;
        padding: 0.55rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
      }

      .db-btn-primary:hover {
        opacity: 0.9;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: #ffffff;
        border: 1px solid #eaeaea;
        border-radius: 10px;
        overflow: hidden;
      }

      thead {
        background: #f9fafb;
      }

      th,
      td {
        text-align: left;
        padding: 0.75rem 1rem;
        font-size: 0.85rem;
        border-bottom: 1px solid #f0f0f0;
      }

      th {
        color: #6b7280;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 0.7rem;
        letter-spacing: 0.03em;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .badge {
        display: inline-block;
        padding: 0.2rem 0.6rem;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
      }

      .badge-open {
        background: #ecfdf5;
        color: #047857;
      }

      .badge-closed {
        background: #fef2f2;
        color: #b91c1c;
      }

      .status-select {
        padding: 0.3rem 0.5rem;
        border-radius: 6px;
        border: 1px solid #d1d5db;
        font-size: 0.8rem;
      }

      .db-action-link {
        color: var(--fb-orange);
        cursor: pointer;
        font-size: 0.8rem;
        font-weight: 600;
        background: none;
        border: none;
        padding: 0;
      }

      .db-action-link:hover {
        text-decoration: underline;
      }

      .db-empty {
        padding: 2rem;
        text-align: center;
        color: #9ca3af;
        font-size: 0.9rem;
      }

      /* Modal for job create/edit */
      .db-modal-backdrop {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.4);
        align-items: center;
        justify-content: center;
        z-index: 50;
        padding: 1rem;
      }

      .db-modal-backdrop.active {
        display: flex;
      }

      .db-modal {
        background: #ffffff;
        border-radius: 12px;
        padding: 1.75rem;
        width: 100%;
        max-width: 520px;
        max-height: 90vh;
        overflow-y: auto;
      }

      .db-modal h3 {
        margin-top: 0;
        color: var(--fb-green);
      }

      .db-field {
        margin-bottom: 1rem;
      }

      .db-field label {
        display: block;
        font-size: 0.8rem;
        font-weight: 500;
        color: #374151;
        margin-bottom: 0.35rem;
      }

      .db-field input,
      .db-field select,
      .db-field textarea {
        width: 100%;
        padding: 0.55rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 8px;
        font-size: 0.85rem;
        font-family: inherit;
      }

      .db-field textarea {
        resize: vertical;
        min-height: 70px;
      }

      .db-modal-actions {
        display: flex;
        gap: 0.6rem;
        margin-top: 1.25rem;
      }

      .db-btn-secondary {
        background: #f3f4f6;
        color: #374151;
        border: none;
        padding: 0.55rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        cursor: pointer;
        flex: 1;
      }

      .db-modal-actions .db-btn-primary {
        flex: 1;
      }

      .db-row-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 0.75rem;
      }
    </style>
  </head>
  <body>
    <header class="db-header">
      <div class="db-header-left">
        <img src="/assets/images/figbloom_logo.png" alt="Figbloom" />
        <span>Admin Dashboard</span>
      </div>
      <button class="db-logout" id="logout-btn">Log out</button>
    </header>

    <div class="db-tabs">
      <div class="db-tab active" data-panel="jobs">Jobs</div>
      <div class="db-tab" data-panel="applications">Applications</div>
      <div class="db-tab" data-panel="newsletter">Newsletter</div>
    </div>

    <div class="db-content">
      <!-- JOBS PANEL -->
      <section id="panel-jobs" class="db-panel active">
        <div class="db-panel-header">
          <h2>Job Postings</h2>
          <button class="db-btn-primary" id="new-job-btn">+ New Job</button>
        </div>
        <div id="jobs-table-wrap">
          <div class="db-empty">Loading jobs...</div>
        </div>
      </section>

      <!-- APPLICATIONS PANEL -->
      <section id="panel-applications" class="db-panel">
        <div class="db-panel-header">
          <h2>Job Applications</h2>
        </div>
        <div id="applications-table-wrap">
          <div class="db-empty">Loading applications...</div>
        </div>
      </section>

      <!-- NEWSLETTER PANEL -->
      <section id="panel-newsletter" class="db-panel">
        <div class="db-panel-header">
          <h2>Newsletter Subscribers</h2>
        </div>
        <div id="newsletter-table-wrap">
          <div class="db-empty">Loading subscribers...</div>
        </div>
      </section>
    </div>

    <!-- JOB CREATE/EDIT MODAL -->
    <div class="db-modal-backdrop" id="job-modal-backdrop">
      <div class="db-modal">
        <h3 id="job-modal-title">New Job</h3>
        <form id="job-form">
          <input type="hidden" id="job-id" />

          <div class="db-field">
            <label for="job-title">Title</label>
            <input id="job-title" required />
          </div>

          <div class="db-row-grid">
            <div class="db-field">
              <label for="job-department">Department</label>
              <input id="job-department" required />
            </div>
            <div class="db-field">
              <label for="job-location">Location</label>
              <select id="job-location">
                <option value="onsite">Onsite</option>
                <option value="hybrid">Hybrid</option>
                <option value="remote">Remote</option>
              </select>
            </div>
          </div>

          <div class="db-row-grid">
            <div class="db-field">
              <label for="job-employment-type">Employment Type</label>
              <select id="job-employment-type">
                <option value="full_time">Full Time</option>
                <option value="part_time">Part Time</option>
                <option value="contract">Contract</option>
                <option value="internship">Internship</option>
              </select>
            </div>
            <div class="db-field">
              <label for="job-experience">Experience</label>
              <input id="job-experience" placeholder="e.g. 3 years" />
            </div>
          </div>

          <div class="db-row-grid">
            <div class="db-field">
              <label for="job-salary">Salary</label>
              <input id="job-salary" placeholder="e.g. 100000" />
            </div>
            <div class="db-field">
              <label for="job-deadline">Deadline</label>
              <input id="job-deadline" type="date" />
            </div>
          </div>

          <div class="db-field">
            <label for="job-description">Description</label>
            <textarea id="job-description" required></textarea>
          </div>

          <div class="db-field">
            <label for="job-requirements">Requirements</label>
            <textarea id="job-requirements" required></textarea>
          </div>

          <div class="db-field">
            <label for="job-is-open">Status</label>
            <select id="job-is-open">
              <option value="true">Open</option>
              <option value="false">Closed</option>
            </select>
          </div>

          <div class="db-modal-actions">
            <button type="button" class="db-btn-secondary" id="job-cancel-btn">Cancel</button>
            <button type="submit" class="db-btn-primary">Save</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      function getCsrfToken() {
        return (
          document.cookie
            .split('; ')
            .find((row) => row.startsWith('csrftoken='))
            ?.split('=')[1] || ''
        );
      }

      async function apiFetch(url, options = {}) {
        const response = await fetch(url, {
          credentials: 'same-origin',
          ...options,
          headers: {
            'X-CSRFToken': getCsrfToken(),
            ...(options.headers || {}),
          },
        });

        if (response.status === 401 || response.status === 403) {
          window.location.href = '/admin-dashboard/login';
          throw new Error('Not authenticated');
        }

        return response;
      }

      // --- Tabs ---
      document.querySelectorAll('.db-tab').forEach((tab) => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.db-tab').forEach((t) => t.classList.remove('active'));
          document.querySelectorAll('.db-panel').forEach((p) => p.classList.remove('active'));
          tab.classList.add('active');
          document.getElementById('panel-' + tab.dataset.panel).classList.add('active');
        });
      });

      // --- Logout ---
      document.getElementById('logout-btn').addEventListener('click', async () => {
        await apiFetch('/api/auth/logout/', { method: 'POST' });
        window.location.href = '/admin-dashboard/login';
      });

      // --- JOBS ---
      let jobsCache = [];

      async function loadJobs() {
        const wrap = document.getElementById('jobs-table-wrap');
        try {
          const res = await apiFetch('/api/admin/jobs/');
          const data = await res.json();
          jobsCache = Array.isArray(data) ? data : data.results || [];

          if (!jobsCache.length) {
            wrap.innerHTML = '<div class="db-empty">No jobs posted yet.</div>';
            return;
          }

          wrap.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Title</th>
                  <th>Department</th>
                  <th>Location</th>
                  <th>Status</th>
                  <th>Deadline</th>
                  <th></th>
                </tr>
              </thead>
              <tbody>
                ${jobsCache
                  .map(
                    (job) => `
                  <tr>
                    <td>${job.title}</td>
                    <td>${job.department}</td>
                    <td>${job.location}</td>
                    <td><span class="badge ${job.is_open ? 'badge-open' : 'badge-closed'}">${job.is_open ? 'Open' : 'Closed'}</span></td>
                    <td>${job.deadline || '—'}</td>
                    <td>
                      <button class="db-action-link" onclick="editJob(${job.id})">Edit</button>
                      &nbsp;&middot;&nbsp;
                      <button class="db-action-link" onclick="deleteJob(${job.id})">Delete</button>
                    </td>
                  </tr>
                `,
                  )
                  .join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          if (error.message !== 'Not authenticated') {
            wrap.innerHTML = '<div class="db-empty">Unable to load jobs.</div>';
            console.error(error);
          }
        }
      }

      function openJobModal() {
        document.getElementById('job-modal-backdrop').classList.add('active');
      }

      function closeJobModal() {
        document.getElementById('job-modal-backdrop').classList.remove('active');
        document.getElementById('job-form').reset();
        document.getElementById('job-id').value = '';
        document.getElementById('job-modal-title').textContent = 'New Job';
      }

      document.getElementById('new-job-btn').addEventListener('click', () => {
        closeJobModal();
        openJobModal();
      });

      document.getElementById('job-cancel-btn').addEventListener('click', closeJobModal);

      window.editJob = function (id) {
        const job = jobsCache.find((j) => j.id === id);
        if (!job) return;

        document.getElementById('job-id').value = job.id;
        document.getElementById('job-title').value = job.title;
        document.getElementById('job-department').value = job.department;
        document.getElementById('job-location').value = job.location;
        document.getElementById('job-employment-type').value = job.employment_type;
        document.getElementById('job-experience').value = job.experience || '';
        document.getElementById('job-salary').value = job.salary || '';
        document.getElementById('job-deadline').value = job.deadline || '';
        document.getElementById('job-description').value = job.description;
        document.getElementById('job-requirements').value = job.requirements;
        document.getElementById('job-is-open').value = job.is_open ? 'true' : 'false';
        document.getElementById('job-modal-title').textContent = 'Edit Job';

        openJobModal();
      };

      window.deleteJob = async function (id) {
        if (!confirm('Delete this job posting? This cannot be undone.')) return;

        try {
          await apiFetch(`/api/admin/jobs/${id}/`, { method: 'DELETE' });
          loadJobs();
        } catch (error) {
          console.error(error);
        }
      };

      document.getElementById('job-form').addEventListener('submit', async (event) => {
        event.preventDefault();

        const id = document.getElementById('job-id').value;
        const payload = {
          title: document.getElementById('job-title').value,
          department: document.getElementById('job-department').value,
          location: document.getElementById('job-location').value,
          employment_type: document.getElementById('job-employment-type').value,
          experience: document.getElementById('job-experience').value,
          salary: document.getElementById('job-salary').value,
          deadline: document.getElementById('job-deadline').value || null,
          description: document.getElementById('job-description').value,
          requirements: document.getElementById('job-requirements').value,
          is_open: document.getElementById('job-is-open').value === 'true',
        };

        try {
          const url = id ? `/api/admin/jobs/${id}/` : '/api/admin/jobs/';
          const method = id ? 'PATCH' : 'POST';

          const res = await apiFetch(url, {
            method,
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload),
          });

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            alert('Error saving job: ' + JSON.stringify(errData));
            return;
          }

          closeJobModal();
          loadJobs();
        } catch (error) {
          console.error(error);
        }
      });

      // --- APPLICATIONS ---
      async function loadApplications() {
        const wrap = document.getElementById('applications-table-wrap');
        try {
          const res = await apiFetch('/api/admin/applications/');
          const data = await res.json();
          const applications = Array.isArray(data) ? data : data.results || [];

          if (!applications.length) {
            wrap.innerHTML = '<div class="db-empty">No applications yet.</div>';
            return;
          }

          const statuses = ['new', 'reviewed', 'shortlisted', 'interview', 'rejected', 'hired'];

          wrap.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Applicant</th>
                  <th>Job</th>
                  <th>Email</th>
                  <th>Phone</th>
                  <th>CV</th>
                  <th>Status</th>
                  <th>Applied</th>
                </tr>
              </thead>
              <tbody>
                ${applications
                  .map(
                    (app) => `
                  <tr>
                    <td>${app.full_name}</td>
                    <td>${app.job_title || app.job}</td>
                    <td>${app.email}</td>
                    <td>${app.phone || '—'}</td>
                    <td>${app.cv_file ? `<a href="${app.cv_file}" target="_blank" class="db-action-link">View</a>` : '—'}</td>
                    <td>
                      <select class="status-select" onchange="updateApplicationStatus(${app.id}, this.value)">
                        ${statuses
                          .map(
                            (s) =>
                              `<option value="${s}" ${s === app.status ? 'selected' : ''}>${s.charAt(0).toUpperCase() + s.slice(1)}</option>`,
                          )
                          .join('')}
                      </select>
                    </td>
                    <td>${new Date(app.applied_at).toLocaleDateString()}</td>
                  </tr>
                `,
                  )
                  .join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          if (error.message !== 'Not authenticated') {
            wrap.innerHTML = '<div class="db-empty">Unable to load applications.</div>';
            console.error(error);
          }
        }
      }

      window.updateApplicationStatus = async function (id, status) {
        try {
          await apiFetch(`/api/admin/applications/${id}/`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ status }),
          });
        } catch (error) {
          console.error(error);
        }
      };

      // --- NEWSLETTER ---
      async function loadNewsletter() {
        const wrap = document.getElementById('newsletter-table-wrap');
        try {
          const res = await apiFetch('/api/admin/newsletter/');
          const data = await res.json();
          const subs = Array.isArray(data) ? data : data.results || [];

          if (!subs.length) {
            wrap.innerHTML = '<div class="db-empty">No subscribers yet.</div>';
            return;
          }

          wrap.innerHTML = `
            <table>
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Subscribed</th>
                </tr>
              </thead>
              <tbody>
                ${subs
                  .map(
                    (sub) => `
                  <tr>
                    <td>${sub.email}</td>
                    <td>${new Date(sub.subscribed_at).toLocaleDateString()}</td>
                  </tr>
                `,
                  )
                  .join('')}
              </tbody>
            </table>
          `;
        } catch (error) {
          if (error.message !== 'Not authenticated') {
            wrap.innerHTML = '<div class="db-empty">Unable to load subscribers.</div>';
            console.error(error);
          }
        }
      }

      // --- Init ---
      loadJobs();
      loadApplications();
      loadNewsletter();
    </script>
  </body>
</html>
