<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="robots"
    content="noindex, nofollow"
  >

  <title>Profile Settings | Figbloom Digital Group</title>

  <style>

    :root {
      --fig-green: #183c22;
      --fig-green-dark: #102d18;
      --fig-orange: #ff9400;
      --fig-bg: #f7f9f7;
      --fig-border: #e5e9e5;
      --fig-muted: #718096;
      --white: #ffffff;
      --danger: #dc2626;
      --success: #15803d;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--fig-bg);
      color: var(--fig-green);
      font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .header {
      height: 82px;
      background: white;
      border-bottom: 1px solid var(--fig-border);

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 34px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand img {
      width: 50px;
    }

    .brand span {
      font-size: 20px;
      font-weight: 800;
    }

    .back-btn {
      border: 1px solid var(--fig-border);
      background: white;
      color: var(--fig-green);

      padding: 11px 18px;
      border-radius: 10px;

      font-weight: 700;
      cursor: pointer;
    }

    .back-btn:hover {
      border-color: var(--fig-orange);
      color: var(--fig-orange);
    }

    .container {
      width: min(850px, calc(100% - 30px));
      margin: 50px auto;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .page-title p {
      margin-top: 8px;
      color: var(--fig-muted);
    }

    .card {
      background: white;
      border: 1px solid var(--fig-border);
      border-radius: 18px;
      padding: 30px;

      box-shadow:
        0 10px 30px rgba(24, 60, 34, 0.06);
    }

    .section-title {
      margin: 0 0 5px;
      font-size: 20px;
      font-weight: 800;
    }

    .section-description {
      margin: 0 0 25px;
      color: var(--fig-muted);
      font-size: 14px;
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      margin-bottom: 8px;

      font-size: 13px;
      font-weight: 800;
    }

    .field input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #d8ded9;
      border-radius: 10px;

      outline: none;

      color: var(--fig-green);
      background: white;
    }

    .field input:focus {
      border-color: var(--fig-orange);

      box-shadow:
        0 0 0 3px rgba(255, 148, 0, 0.12);
    }

    .password-help {
      margin-top: 7px;

      color: var(--fig-muted);
      font-size: 12px;
    }

    .actions {
      display: flex;
      justify-content: flex-end;

      margin-top: 25px;
    }

    .save-btn {
      border: 0;

      background: var(--fig-green);
      color: white;

      padding: 13px 22px;

      border-radius: 10px;

      font-weight: 800;

      cursor: pointer;
    }

    .save-btn:hover {
      background: var(--fig-orange);
    }

    .save-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;

      padding: 13px 15px;

      border-radius: 10px;

      margin-bottom: 20px;

      font-size: 14px;
      font-weight: 700;
    }

    .message.success {
      display: block;

      background: #ecfdf3;
      color: var(--success);
    }

    .message.error {
      display: block;

      background: #fef2f2;
      color: var(--danger);
    }

    @media(max-width:700px) {

      .header {
        padding: 0 18px;
      }

      .brand span {
        font-size: 16px;
      }

      .card {
        padding: 22px;
      }

      .actions {
        display: block;
      }

      .save-btn {
        width: 100%;
      }

    }

  </style>

</head>


<body>


<header class="header">

  <div class="brand">

    <img
      src="/assets/images/figbloom_logo.png"
      alt="Figbloom Digital Group"
    >

    <span>
      Profile Settings
    </span>

  </div>


  <button
    class="back-btn"
    id="back-dashboard"
  >
    ← Dashboard
  </button>

</header>



<main class="container">


  <div class="page-title">

    <h1>
      Profile Settings
    </h1>

    <p>
      Manage your administrator account and security settings.
    </p>

  </div>



  <div class="card">


    <h2 class="section-title">
      Change Password
    </h2>

    <p class="section-description">
      Update your administrator password. You will be logged out after successfully changing it.
    </p>


    <div
      id="message"
      class="message"
    ></div>


    <form id="password-form">
<div class="field" style="position: relative;">
 <input
          type="password"
          id="current-password"
          required
          autocomplete="current-password"
          placeholder="Enter your current password"
        >
  <span
    onclick="togglePassword('current-password', 'eye-current-on')"
    style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer;"
  >
  </span>
</div>



      <div class="field">

        <label for="new-password">
          New Password
        </label>

        <input
          type="password"
          id="new-password"
          required
          autocomplete="new-password"
          placeholder="Enter your new password"
        >

        <div class="password-help">
          Use a strong password that you do not use elsewhere.
        </div>

      </div>



      <div class="field">

        <label for="confirm-password">
          Confirm New Password
        </label>

        <input
          type="password"
          id="confirm-password"
          required
          autocomplete="new-password"
          placeholder="Confirm your new password"
        >

      </div>



      <div class="actions">

        <button
          type="submit"
          class="save-btn"
          id="save-password-btn"
        >
          Change Password
        </button>

      </div>


    </form>


  </div>


</main>



<script>

const API_BASE =
  window.location.hostname === "localhost" ||
  window.location.hostname === "127.0.0.1"
    ? "http://127.0.0.1:8000"
    : "";



function getCsrfToken() {

  return (
    document.cookie
      .split("; ")
      .find(
        row => row.startsWith("csrftoken=")
      )
      ?.split("=")[1] || ""
  );

}



async function apiFetch(
  url,
  options = {}
) {

  const response =
    await fetch(
      `${API_BASE}${url}`,
      {
        ...options,

        credentials: "include",

        headers: {
          ...(options.headers || {}),

          "X-CSRFToken":
            getCsrfToken()
        }
      }
    );


  if (
    response.status === 401 ||
    response.status === 403
  ) {

    window.location.href =
      "/admin-dashboard/login";

    throw new Error(
      "Not authenticated"
    );

  }


  return response;

}



document
  .getElementById("back-dashboard")
  .addEventListener(
    "click",
    () => {

      window.location.href =
        "/admin-dashboard/";

    }
  );



document
  .getElementById("password-form")
  .addEventListener(
    "submit",
    async event => {

      event.preventDefault();


      const currentPassword =
        document
          .getElementById(
            "current-password"
          )
          .value;


      const newPassword =
        document
          .getElementById(
            "new-password"
          )
          .value;


      const confirmPassword =
        document
          .getElementById(
            "confirm-password"
          )
          .value;


      const message =
        document.getElementById(
          "message"
        );


      const button =
        document.getElementById(
          "save-password-btn"
        );


      message.className =
        "message";


      message.textContent =
        "";


      if (
        newPassword !==
        confirmPassword
      ) {

        message.className =
          "message error";

        message.textContent =
          "The new passwords do not match.";

        return;

      }


      if (
        newPassword.length < 8
      ) {

        message.className =
          "message error";

        message.textContent =
          "Your new password must contain at least 8 characters.";

        return;

      }


      button.disabled = true;

      button.textContent =
        "Changing Password...";


      try {

        const response =
          await apiFetch(
            "/api/auth/change-password/",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({

                  current_password:
                    currentPassword,

                  new_password:
                    newPassword,

                  confirm_password:
                    confirmPassword

                })

            }
          );


        const data =
          await response
            .json()
            .catch(
              () => ({})
            );


        if (!response.ok) {

          throw new Error(
            data.detail ||
            "Unable to change password."
          );

        }


        message.className =
          "message success";

        message.textContent =
          "Password changed successfully. You will be redirected to the login page.";


        document
          .getElementById(
            "password-form"
          )
          .reset();


        setTimeout(
          () => {

            window.location.href =
              "/admin-dashboard/login";

          },
          2000
        );


      } catch(error) {

        if (
          error.message !==
          "Not authenticated"
        ) {

          message.className =
            "message error";

          message.textContent =
            error.message;

        }

      } finally {

        button.disabled = false;

        button.textContent =
          "Change Password";

      }

    }
  );

function togglePassword(inputId, eyeOnId, eyeOffId) {
  const input = document.getElementById(inputId);
  const eyeOn = document.getElementById(eyeOnId);
  const eyeOff = document.getElementById(eyeOffId);

  if (input.type === "password") {
    input.type = "text";
    eyeOn.style.display = "none";
    eyeOff.style.display = "block";
  } else {
    input.type = "password";
    eyeOn.style.display = "block";
    eyeOff.style.display = "none";
  }
}


</script>


</body>

</html>
