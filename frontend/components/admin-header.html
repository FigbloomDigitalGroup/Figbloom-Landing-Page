<!--
    Shared admin-dashboard sidebar nav, mirroring how components/navbar.html
    works for the public site.

    Active-item highlighting for the three standalone pages (Dashboard,
    Contact, Subscribers) is resolved server-side via the active_nav
    context variable each view passes in — unchanged from before.

    Jobs/Applications/Newsletter are still tabs inside index.html, not
    separate routes, so those three links carry class="db-tab" and
    data-panel="..." — index.html's existing tab-switching JS
    (querySelectorAll(".db-tab")) already wires up click handling for any
    element with that class regardless of where it lives in the DOM, so
    no JS changes were needed there beyond reading the URL hash on load
    (see index.html) so linking to e.g. #jobs from another page actually
    opens that tab instead of always landing on Overview.
-->
<aside class="ad-sidebar">
    <a href="/admin-dashboard/" class="ad-brand-mark">
        <img src="/assets/images/figbloom_logo.png" alt="Figbloom Digital Group" />
        <span class="name">Figbloom<small>Ops Console</small></span>
    </a>

    <nav class="ad-nav-group">
        <div class="ad-nav-label">Workspace</div>

        <a href="/admin-dashboard/" class="ad-nav-item db-tab{% if active_nav == 'dashboard' %} active{% endif %}" data-panel="overview">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
            Overview
        </a>

        <a href="/admin-dashboard/#jobs" class="ad-nav-item db-tab" data-panel="jobs">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
            Jobs
        </a>

        <a href="/admin-dashboard/#applications" class="ad-nav-item db-tab" data-panel="applications">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3v4a1 1 0 0 0 1 1h4"/><path d="M17 21H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h7l5 5v11a2 2 0 0 1-2 2Z"/><path d="M9 13h6M9 17h6"/></svg>
            Applications
        </a>

        <a href="/admin-dashboard/#newsletter" class="ad-nav-item db-tab" data-panel="newsletter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
            Newsletter
        </a>
    </nav>

    <nav class="ad-nav-group">
        <div class="ad-nav-label">Inbound</div>

        <a href="/admin-dashboard/contact" class="ad-nav-item{% if active_nav == 'contact' %} active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5Z"/></svg>
            Contact
        </a>

        <a href="/admin-dashboard/subscribers" class="ad-nav-item{% if active_nav == 'subscribers' %} active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>
            Subscribers
        </a>
    </nav>

    <div class="ad-sidebar-footer">
        <a href="/" target="_blank" rel="noopener" class="ad-nav-item">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/><path d="M15 3h6v6"/><path d="M10 14 21 3"/></svg>
            View site
        </a>

        <a href="/admin-dashboard/profile-settings" class="ad-nav-item{% if active_nav == 'profile' %} active{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.6 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z"/></svg>
            Profile Settings
        </a>

        <button type="button" class="ad-nav-item" id="admin-logout-btn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>
            Log out
        </button>
    </div>
</aside>

<!--
    Light/dark toggle, fixed to the viewport's top-right corner so it shows
    up consistently regardless of each page's own content layout (none of
    the admin pages have a shared topbar to anchor it to otherwise). Wiring
    + persistence lives in admin.js (initThemeToggle) since that's already
    loaded on every admin page.
-->
<button
    type="button"
    class="ad-theme-toggle"
    id="theme-toggle"
    role="switch"
    aria-checked="false"
    aria-label="Toggle dark mode"
>
    <span class="ad-theme-toggle-knob">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79Z"/></svg>
    </span>
</button>
