<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Admin Login | Figbloom Digital Group</title>
    {% include "components/favicon.html" %}
    <link rel="stylesheet" href="/assets/css/style.css" />
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap');

      :root {
        --fig-green: #2c5322;
        --fig-orange: #ff9400;
        --fig-text: #12151e;
        --fig-muted: #67788f;
        --fig-border: #e0e5eb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        font-family: "Outfit", ui-sans-serif, system-ui, sans-serif;
      }

      .login-shell {
        width: 100%;
        max-width: 380px;
        padding: 2.5rem 2rem;
        border-radius: 0.75rem;
        border: 1px solid var(--fig-border);
        box-shadow: 0 20px 60px -20px rgba(18, 21, 30, 0.15);
      }

      .login-logo {
        display: flex;
        justify-content: center;
        margin-bottom: 1.75rem;
      }

      .login-logo img {
        width: 90px;
      }

      .login-title {
        text-align: center;
        color: var(--fig-text);
        font-size: 1.35rem;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }

      .login-subtitle {
        text-align: center;
        color: var(--fig-muted);
        font-size: 0.9rem;
        margin-bottom: 1.75rem;
      }

      .login-field {
        margin-bottom: 1.1rem;
      }

      .login-field label {
        display: block;
        font-size: 0.85rem;
        font-weight: 500;
        color: var(--fig-text);
        margin-bottom: 0.4rem;
      }

      .login-field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.65rem 0.85rem;
        border: 1px solid var(--fig-border);
        border-radius: 0.5rem;
        font-size: 0.95rem;
        font-family: inherit;
        outline: none;
        box-shadow: inset 0 1px 2px rgba(18, 21, 30, 0.03);
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }

      .login-field input:hover {
        border-color: rgba(255, 148, 0, 0.4);
      }

      .login-field input:focus {
        border-color: var(--fig-orange);
        box-shadow: 0 0 0 3px rgba(255, 148, 0, 0.15);
      }

      .login-submit {
        width: 100%;
        padding: 0.75rem;
        margin-top: 0.5rem;
        border: none;
        border-radius: 0.5rem;
        background: var(--fig-green);
        color: #ffffff;
        font-weight: 600;
        font-size: 0.95rem;
        font-family: inherit;
        cursor: pointer;
        transition: background-color 0.2s ease;
      }

      .login-submit:hover {
        background: var(--fig-orange);
      }

      .login-submit:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }

      .login-error {
        display: none;
        margin-top: 1rem;
        padding: 0.65rem 0.85rem;
        border-radius: 0.5rem;
        background: #fef2f2;
        border: 1px solid #fecaca;
        color: #b91c1c;
        font-size: 0.85rem;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="login-shell">
      <div class="login-logo">
        <img src="/assets/images/figbloom_logo.png" alt="Figbloom Digital Group" />
      </div>

      <div class="login-title">Admin Dashboard</div>
      <div class="login-subtitle">Sign in to manage jobs, applications, and subscribers</div>

      <form id="login-form">
        <div class="login-field">
          <label for="username">Username</label>
          <input id="username" name="username" type="text" required autocomplete="username" />
        </div>

        <div class="login-field">
          <label for="password">Password</label>
          <div style="position: relative;">
            <input id="password" name="password" type="password" required autocomplete="current-password" style="padding-right: 2.5rem;" />
            <span
              class="eye-toggle"
              onclick="togglePassword('password', 'eye-password-on', 'eye-password-off')"
              style="position:absolute; right:12px; top:50%; transform:translateY(-50%); cursor:pointer; color: var(--fig-muted); display:flex;"
            >
              <svg id="eye-password-on" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /></svg>
              <svg id="eye-password-off" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7Z" /><circle cx="12" cy="12" r="3" /><line x1="3" y1="21" x2="21" y2="3" /></svg>
            </span>
          </div>
        </div>

        <button type="submit" class="login-submit">Sign in</button>
        <div id="login-error" class="login-error"></div>
      </form>
    </div>

    <script src="/assets/js/admin.js"></script>
    <script>
        function togglePassword(inputId, eyeOnId, eyeOffId) {
          const input = document.getElementById(inputId);
          const eyeOn = document.getElementById(eyeOnId);
          const eyeOff = document.getElementById(eyeOffId);

          if (input.type === "password") {
            input.type = "text";
            eyeOn.style.display = "none";
            eyeOff.style.display = "block";
          } else {
            input.type = "password";
            eyeOn.style.display = "block";
            eyeOff.style.display = "none";
          }
        }

        initializeCsrf().catch(console.error);
      async function initializeCsrf() {
    await fetch('/api/auth/csrf/', {
        method: 'GET',
        credentials: 'include',
    });
}

      document.getElementById('login-form').addEventListener('submit', async (event) => {
    event.preventDefault();

    const errorBox = document.getElementById('login-error');
    errorBox.style.display = 'none';

    const submitButton = event.target.querySelector('.login-submit');
    const originalText = submitButton.textContent;
    submitButton.disabled = true;
    submitButton.textContent = 'Signing in…';

    let succeeded = false;

    try {
        // Get CSRF cookie from Django first
        await initializeCsrf();

        const formData = new FormData(event.target);

        const response = await fetch(
            '/api/auth/login/',
            {
                method: 'POST',
                credentials: 'include',
                headers: {
                    'X-CSRFToken': getCsrfToken(),
                },
                body: formData,
            }
        );

        const data = await response.json().catch(() => ({}));

        if (!response.ok) {
            errorBox.textContent =
                data.detail || 'Invalid username or password.';
            errorBox.style.display = 'block';
            return;
        }

        succeeded = true;
        window.location.href = '/admin-dashboard/';
    } catch (error) {
        console.error('Login error:', error);
        errorBox.textContent =
            'Unable to reach the server. Please try again.';
        errorBox.style.display = 'block';
    } finally {
        // Left disabled on success — the page is about to navigate away.
        if (!succeeded) {
            submitButton.disabled = false;
            submitButton.textContent = originalText;
        }
    }
});
  </script>
  </body>
</html>
